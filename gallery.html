<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery - Sahu Creations</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300&family=Great+Vibes&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root { --c-bg: #1A0A00; --c-primary: #D4AF37; --c-text: #FAF0DC; --f-display: 'Cinzel', serif; --f-body: 'Josefin Sans', sans-serif; }
body { background: var(--c-bg); color: var(--c-text); font-family: var(--f-body); margin: 0; padding: 2rem; }
h1 { font-family: var(--f-display); color: var(--c-primary); text-align: center; margin-bottom: 2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
a.back-btn { color: var(--c-primary); text-decoration: none; display: inline-block; margin-bottom: 2rem; border: 1px solid var(--c-primary); padding: 0.5rem 1rem; border-radius: 4px; transition: all 0.3s; }
a.back-btn:hover { background: var(--c-primary); color: var(--c-bg); }
.masonry-grid { column-count: 2; column-gap: 1rem; max-width: 1200px; margin: 0 auto; }
@media (min-width: 600px) { .masonry-grid { column-count: 3; } }
@media (min-width: 900px) { .masonry-grid { column-count: 4; } }
.masonry-item { break-inside: avoid; margin-bottom: 1rem; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid rgba(212,175,55,0.3); transition: transform 0.3s; cursor: pointer; }
.masonry-item:hover { transform: scale(1.02); border-color: rgba(212,175,55,0.8); z-index: 10; position: relative;}
.masonry-item img { width: 100%; height: auto; display: block; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background-color: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.modal.active { opacity: 1; pointer-events: auto; }
.modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 20px rgba(212,175,55,0.2); }
.modal-close { position: absolute; top: 20px; right: 30px; color: var(--c-primary); font-size: 40px; font-weight: bold; cursor: pointer; transition: color 0.3s; z-index: 1001; }
.modal-close:hover { color: #fff; }
</style>
</head>
<body>
<a href="index.html" class="back-btn">&larr; Back to Home</a>
<h1>Our Wedding Gallery</h1>
<div class="masonry-grid">
  <div class="masonry-item"><img src="images/wedding_1_1780780713505.webp" alt="Indian bride portrait" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_2_1780780726405.webp" alt="Indian groom portrait" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_3_1780780739743.webp" alt="Bride and groom holding hands" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_4_1780780752445.webp" alt="Haldi ceremony" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_5_1780780766152.webp" alt="Bridal Mehendi henna" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_6_1780780778778.webp" alt="Vidaai emotional ceremony" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_7_1780780791193.webp" alt="Wedding venue decoration at night" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_8_1780780806306.webp" alt="Bride twirling in lehenga" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_9_1780780821444.webp" alt="Groom riding horse in Baraat" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_10_1780780832777.webp" alt="Wedding couple taking pheras" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_11_1780780846106.webp" alt="Jaimala garland exchange" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_12_1780780859473.webp" alt="Wedding rings macro photography" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_13_1780780872083.webp" alt="Bridal gold jewelry" loading="lazy"></div>
  <div class="masonry-item"><img src="images/wedding_14_1780780885199.webp" alt="Wedding couple sunset silhouette" loading="lazy"></div>
</div>

<div class="modal" id="imageModal" onclick="closeModal()">
  <span class="modal-close">&times;</span>
  <img id="modalImg" src="" onclick="event.stopPropagation()">
</div>

<script>
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');

  document.querySelectorAll('.masonry-item img').forEach(img => {
    img.addEventListener('click', function() {
      modalImg.src = this.src;
      modal.classList.add('active');
    });
  });

  function closeModal() {
    modal.classList.remove('active');
  }

  // Close modal with Escape key
  document.addEventListener('keydown', function(event) {
    if (event.key === "Escape") {
      closeModal();
    }
  });
</script>
</body>
</html>
